<style>
/* ============ MovieBox-style streaming UI ============ */
:root{
  --bg:#0d0d0f;
  --bg-soft:#16161a;
  --card:#1c1c21;
  --text:#f5f5f7;
  --muted:#a3a3ad;
  --accent:#e50914;
  --accent-hover:#f6121d;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block;max-width:100%}

/* ---------- NAV ---------- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;gap:2rem;
  padding:1rem 4vw;
  background:linear-gradient(to bottom,rgba(13,13,15,.95),rgba(13,13,15,0));
  transition:background .3s;
}
.nav.scrolled{background:var(--bg);box-shadow:0 2px 12px rgba(0,0,0,.5)}
.logo{
  font-size:1.5rem;font-weight:900;letter-spacing:1px;
  color:var(--accent);
}
.nav-links{display:flex;gap:1.5rem;font-size:.95rem;color:var(--muted)}
.nav-links a:hover{color:var(--text)}
.search-wrap{margin-left:auto;position:relative}
.search-input{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;
  padding:.5rem 1rem .5rem 2.4rem;
  color:var(--text);width:220px;outline:none;
  transition:width .3s,border-color .3s;
}
.search-input:focus{width:300px;border-color:var(--accent)}
.search-icon{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}

/* ---------- HERO ---------- */
.hero{
  position:relative;height:80vh;min-height:520px;
  display:flex;align-items:flex-end;
}
.hero-bg{
  position:absolute;inset:0;overflow:hidden;
}
.hero-bg img{width:100%;height:100%;object-fit:cover}
.hero-bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top,var(--bg) 4%,rgba(13,13,15,.35) 45%,rgba(13,13,15,.55) 100%);
}
.hero-content{
  position:relative;z-index:2;
  padding:0 4vw 6vh;max-width:700px;
}
.hero-tag{
  display:inline-block;background:var(--accent);
  color:#fff;font-size:.75rem;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  padding:.3rem .8rem;border-radius:4px;margin-bottom:1rem;
}
.hero-title{font-size:clamp(2rem,4.5vw,3.6rem);font-weight:900;line-height:1.05;margin-bottom:.8rem;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.hero-meta{display:flex;gap:1rem;color:var(--muted);font-size:.95rem;margin-bottom:1rem}
.hero-meta .match{color:#46d369;font-weight:700}
.hero-desc{color:#d6d6dd;font-size:1.05rem;line-height:1.6;margin-bottom:1.6rem;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.hero-btns{display:flex;gap:1rem;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:.6rem;
  padding:.8rem 1.8rem;border-radius:6px;
  font-size:1rem;font-weight:700;
  transition:transform .15s,background .2s;
}
.btn:hover{transform:scale(1.04)}
.btn-play{background:#fff;color:#000}
.btn-more{background:rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(4px)}
.btn-more:hover{background:rgba(255,255,255,.35)}

/* ---------- ROWS ---------- */
.rows{padding:2rem 0 4rem}
.row{margin-top:2.2rem}
.row-header{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:0 4vw;margin-bottom:1rem;
}
.row-title{font-size:1.35rem;font-weight:800}
.row-scroll{
  display:flex;gap:.9rem;overflow-x:auto;
  padding:.4rem 4vw 1rem;
  scroll-behavior:smooth;
  scrollbar-width:none;
}
.row-scroll::-webkit-scrollbar{display:none}
.card{
  position:relative;flex:0 0 170px;border-radius:var(--radius);
  overflow:hidden;background:var(--card);
  transition:transform .25s,box-shadow .25s;
  cursor:pointer;
}
@media(min-width:900px){.card{flex-basis:200px}}
.card:hover{transform:translateY(-8px) scale(1.03);box-shadow:0 14px 30px rgba(0,0,0,.55);z-index:2}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover}
.card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.92) 10%,rgba(0,0,0,.15) 55%,transparent);
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:.9rem;opacity:0;transition:opacity .25s;
}
.card:hover .card-overlay{opacity:1}
.card-title{font-weight:800;font-size:.95rem;margin-bottom:.25rem}
.card-meta{color:var(--muted);font-size:.75rem;display:flex;gap:.6rem;margin-bottom:.5rem}
.card-play{
  align-self:flex-start;
  background:var(--accent);color:#fff;
  font-size:.75rem;font-weight:700;
  padding:.35rem .9rem;border-radius:4px;
  display:flex;align-items:center;gap:.4rem;
}
.empty-row{color:var(--muted);padding:0 4vw;font-size:.95rem}

/* ---------- MODAL / PLAYER ---------- */
.modal{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.85);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
  padding:2vh 2vw;
}
.modal.open{display:flex}
.modal-box{
  width:min(960px,100%);max-height:96vh;overflow-y:auto;
  background:var(--bg-soft);border-radius:12px;
  animation:pop .25s ease;
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-hero{position:relative;aspect-ratio:16/9;background:#000}
.modal-hero video,.modal-hero img{width:100%;height:100%;object-fit:cover}
.modal-close{
  position:absolute;top:.8rem;right:.8rem;z-index:3;
  width:38px;height:38px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:1.2rem;
  display:flex;align-items:center;justify-content:center;
}
.modal-close:hover{background:var(--accent)}
.modal-body{padding:1.6rem 2rem 2rem}
.modal-body h2{font-size:1.8rem;margin-bottom:.6rem}
.modal-meta{display:flex;gap:1rem;color:var(--muted);font-size:.9rem;margin-bottom:1rem}
.modal-meta .match{color:#46d369;font-weight:700}
.modal-body p{color:#cfcfd6;line-height:1.65;max-width:720px}

/* ---------- FOOTER ---------- */
footer{
  padding:3rem 4vw;color:var(--muted);font-size:.85rem;
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;
}

/* ---------- SEARCH RESULTS ---------- */
.results-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:1.1rem;padding:7rem 4vw 3rem;
}
.results-title{padding:7rem 4vw 0;font-size:1.6rem;font-weight:800}

/* ---------- EPISODE LIST ---------- */
.episodes-wrap{padding:1.4rem 2rem 0}
.season-block{margin-bottom:1.4rem}
.season-title{font-size:1.1rem;margin-bottom:.6rem;color:var(--text)}
.episode{
  display:flex;align-items:center;gap:1rem;
  padding:.7rem .8rem;border-radius:8px;cursor:pointer;
  transition:background .15s;
}
.episode:hover{background:rgba(255,255,255,.07)}
.ep-num{
  width:34px;height:34px;flex:0 0 34px;border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;color:var(--muted);
}
.ep-info{flex:1}
.ep-name{font-weight:600;font-size:.95rem}
.ep-dur{color:var(--muted);font-size:.8rem}
.ep-play{color:var(--accent);font-size:1rem;width:28px;text-align:center}
.ep-label{font-size:1rem;color:var(--muted);font-weight:500}
@media(max-width:600px){
  .episodes-wrap,.modal-body{padding-left:1rem;padding-right:1rem}
}

/* ---------- MY LIST + HOVER PREVIEW ---------- */
.card{position:relative}
.card-preview{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;
}
.card-overlay{z-index:2}
.card-actions{display:flex;align-items:center;gap:.5rem}
.list-btn{
  width:28px;height:28px;border-radius:50%;
  border:1px solid rgba(255,255,255,.5);color:#fff;
  font-size:1rem;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s;
}
.list-btn:hover{border-color:#fff;background:rgba(255,255,255,.15)}
.list-btn.in-list{background:var(--accent);border-color:var(--accent);color:#fff}

</style>
</head>

<script>
const nav = document.getElementById("nav");
const heroEl = document.getElementById("hero");
const rowsEl = document.getElementById("rows");
const searchInput = document.getElementById("searchInput");
const modal = document.getElementById("modal");

/* ============ Continue Watching (saved in browser) ============ */
const CW_KEY = "myflix_progress";
const loadCW = () => JSON.parse(localStorage.getItem(CW_KEY) || "{}");
const saveCW = (data) => localStorage.setItem(CW_KEY, JSON.stringify(data));

function cwKey(id, ep) { return ep ? `${id}-s${ep.s}e${ep.e}` : `${id}`; }

function trackProgress(video, id, ep) {
  const data = loadCW();
  const k = cwKey(id, ep);
  // resume from saved spot
  if (data[k] && data[k].time > 5 && !data[k].finished) {
    video.currentTime = data[k].time;
  }
  video.addEventListener("timeupdate", () => {
    const d = loadCW();
    const item = MOVIES.find(m => m.id === id);
    d[k] = {
      time: video.currentTime,
      finished: video.duration && video.currentTime / video.duration > 0.92,
      title: item.title,
      poster: item.poster,
      ep: ep ? `S${ep.s}:E${ep.e} "${item.seasons[ep.s-1].episodes[ep.e-1].title}"` : null,
      updated: Date.now()
    };
    saveCW(d);
  });
}

function renderContinueWatching() {
  const data = loadCW();
  const items = Object.entries(data)
    .filter(([, v]) => v.time > 20 && !v.finished)
    .sort((a, b) => b[1].updated - a[1].updated)
    .slice(0, 12);
  if (!items.length) return "";
  return `
    <section class="row">
      <div class="row-header"><h2 class="row-title">Continue Watching</h2></div>
      <div class="row-scroll">
        ${items.map(([k, v]) => `
          <div class="card" onclick="resume('${k}')">
            <img src="${v.poster}" alt="${v.title}">
            <div class="card-overlay">
              <div class="card-title">${v.title}</div>
              <div class="card-meta"><span>${v.ep || "Movie"}</span></div>
              <span class="card-play">&#9654; Resume</span>
            </div>
          </div>`).join("")}
      </div>
    </section>`;
}
function resume(k) {
  const [idPart, epPart] = k.split("-");
  const id = parseInt(idPart);
  if (epPart) {
    const m = epPart.match(/s(\d+)e(\d+)/);
    playEpisode(id, parseInt(m[1]), parseInt(m[2]));
  } else openPlayer(id);
}

window.addEventListener("scroll", () => {
  nav.classList.toggle("scrolled", window.scrollY > 40);
});


/* ============ MY LIST (saved in browser) ============ */
const ML_KEY = "myflix_mylist";
const loadML = () => JSON.parse(localStorage.getItem(ML_KEY) || "[]");
const saveML = (ids) => localStorage.setItem(ML_KEY, JSON.stringify(ids));
const inList = (id) => loadML().includes(id);

function toggleList(id, btn) {
  let ids = loadML();
  if (ids.includes(id)) { ids = ids.filter(x => x !== id); }
  else ids.push(id);
  saveML(ids);
  if (btn) btn.classList.toggle("in-list", ids.includes(id));
  renderRows();
}

function renderMyList() {
  const items = loadML().map(id => MOVIES.find(m => m.id === id)).filter(Boolean);
  if (!items.length) return "";
  return `
    <section class="row">
      <div class="row-header"><h2 class="row-title">My List</h2></div>
      <div class="row-scroll">${items.map(cardHTML).join("")}</div>
    </section>`;
}

/* ============ HERO ============ */
function renderHero() {
  const f = MOVIES.find(m => m.featured) || MOVIES[0];
  heroEl.innerHTML = `
    <div class="hero-bg"><img src="${f.backdrop}" alt="${f.title}"></div>
    <div class="hero-content">
      <span class="hero-tag">${f.type === "series" ? "Original Series" : "Featured Film"}</span>
      <h1 class="hero-title">${f.title}</h1>
      <div class="hero-meta">
        <span class="match">New</span><span>${f.year}</span>
        <span>${f.rating}</span><span>${f.genre}</span>
      </div>
      <p class="hero-desc">${f.description}</p>
      <div class="hero-btns">
        <button class="btn btn-play" onclick="${f.type === "series" ? `playEpisode(${f.id},1,1)` : `openPlayer(${f.id})`}">&#9654; ${f.type === "series" ? "Play S1:E1" : "Play"}</button>
        <button class="btn btn-more" onclick="openDetails(${f.id})">More Info</button>
      </div>
    </div>`;
}

/* ============ ROWS ============ */
const ROWS = [
  { key: "trending", title: "Trending Now" },
  { key: "action",   title: "Action" },
  { key: "drama",    title: "Drama" },
  { key: "comedy",   title: "Comedy" },
  { key: "thriller", title: "Thrillers" },
];

function cardHTML(m) {
  const previewTag = m.preview ? `data-preview="${m.preview}"` : "";
  const listBtn = `<button class="list-btn ${inList(m.id) ? "in-list" : ""}" title="My List"
      onclick="event.stopPropagation(); toggleList(${m.id}, this)">${inList(m.id) ? "&#10003;" : "+"}</button>`;
  return `
    <div class="card" onclick="openDetails(${m.id})" ${previewTag}
         onmouseenter="cardHover(this)" onmouseleave="cardLeave(this)">
      <img src="${m.poster}" alt="${m.title}" loading="lazy">
      <div class="card-overlay">
        <div class="card-title">${m.title}</div>
        <div class="card-meta"><span>${m.year}</span><span>${m.rating}</span><span>${m.type === "series" ? m.seasons.length + " Season" + (m.seasons.length > 1 ? "s" : "") : m.duration}</span></div>
        <div class="card-actions">
          <span class="card-play">&#9654; ${m.type === "series" ? "Episodes" : "Play"}</span>
          ${listBtn}
        </div>
      </div>
    </div>`;
}

/* ---------- hover video preview (Netflix-style) ---------- */
function cardHover(card) {
  const src = card.dataset.preview;
  if (!src) return;
  const v = document.createElement("video");
  v.src = src; v.muted = true; v.loop = true; v.playsInline = true;
  v.className = "card-preview";
  card.appendChild(v);
  v.play().catch(() => {});
}
function cardLeave(card) {
  const v = card.querySelector("video.card-preview");
  if (v) { v.pause(); v.remove(); }
}

function renderRows() {
  rowsEl.innerHTML = renderContinueWatching() + renderMyList() + ROWS.map(r => {
    const items = MOVIES.filter(m => m.categories.includes(r.key));
    if (!items.length) return "";
    return `
      <section class="row">
        <div class="row-header"><h2 class="row-title">${r.title}</h2></div>
        <div class="row-scroll">${items.map(cardHTML).join("")}</div>
      </section>`;
  }).join("");
}

/* ============ DETAILS PAGE (modal) ============ */
function openDetails(id) {
  const m = MOVIES.find(x => x.id === id);
  if (!m) return;
  const body = m.type === "series"
    ? seriesDetailsHTML(m)
    : `
      <div class="modal-hero">
        <video src="${m.video}" controls autoplay poster="${m.backdrop}" id="detailVideo"></video>
        <button class="modal-close" onclick="closeModal()">&#10005;</button>
      </div>`;
  modal.innerHTML = `<div class="modal-box">${body}
      <div class="modal-body">
        <h2>${m.title}</h2>
        <div class="modal-meta">
          <span class="match">New</span><span>${m.year}</span>
          <span>${m.rating}</span><span>${m.genre}</span>
        </div>
        <p>${m.description}</p>
        <div style="margin-top:1.2rem">
          <button class="btn btn-more" onclick="toggleList(${m.id}, this)">
            ${inList(m.id) ? "&#10003; In My List" : "+ My List"}
          </button>
        </div>
      </div></div>`;
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
  const v = document.getElementById("detailVideo");
  if (v) trackProgress(v, m.id, null);
}

function seriesDetailsHTML(m) {
  const seasons = m.seasons.map(s => `
    <div class="season-block">
      <h3 class="season-title">Season ${s.number}</h3>
      ${s.episodes.map(e => `
        <div class="episode" onclick="playEpisode(${m.id},${s.number},${e.number})">
          <span class="ep-num">${e.number}</span>
          <div class="ep-info">
            <div class="ep-name">${e.title}</div>
            <div class="ep-dur">${e.duration}</div>
          </div>
          <span class="ep-play">&#9654;</span>
        </div>`).join("")}
    </div>`).join("");
  return `
    <div class="modal-hero">
      <img src="${m.backdrop}" alt="${m.title}">
      <button class="modal-close" onclick="closeModal()">&#10005;</button>
    </div>
    <div class="episodes-wrap">${seasons}</div>`;
}

/* ============ PLAYER ============ */
function playEpisode(id, sNum, eNum) {
  const m = MOVIES.find(x => x.id === id);
  const ep = m.seasons[sNum - 1].episodes[eNum - 1];
  openPlayer(id, { s: sNum, e: eNum, video: ep.video,
    label: `S${sNum}:E${eNum} "${ep.title}"` });
}
function openPlayer(id, ep = null) {
  const m = MOVIES.find(x => x.id === id);
  if (!m) return;
  const videoSrc = ep ? ep.video : m.video;
  const subtitle = ep ? ep.label : "";
  modal.innerHTML = `
    <div class="modal-box">
      <div class="modal-hero">
        <video src="${videoSrc}" controls autoplay poster="${m.backdrop}" id="playerVideo"></video>
        <button class="modal-close" onclick="closeModal()">&#10005;</button>
      </div>
      <div class="modal-body">
        <h2>${m.title} ${subtitle ? `<span class="ep-label">${subtitle}</span>` : ""}</h2>
        <div class="modal-meta">
          <span class="match">New</span><span>${m.year}</span>
          <span>${m.rating}</span><span>${m.genre}</span>
        </div>
        <p>${m.description}</p>
      </div>
    </div>`;
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
  trackProgress(document.getElementById("playerVideo"), m.id,
    ep ? { s: ep.s, e: ep.e } : null);
}
function closeModal() {
  modal.classList.remove("open");
  modal.innerHTML = "";
  document.body.style.overflow = "";
  renderRows(); // refresh Continue Watching row
}
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ============ SEARCH ============ */
let searching = false;
searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  if (q.length < 2) {
    if (searching) { searching = false; heroEl.style.display = ""; renderRows(); }
    return;
  }
  searching = true;
  heroEl.style.display = "none";
  const hits = MOVIES.filter(m =>
    m.title.toLowerCase().includes(q) || m.genre.toLowerCase().includes(q));
  rowsEl.innerHTML = `
    <h2 class="results-title">Results for "${searchInput.value.trim()}"</h2>
    <div class="results-grid">${hits.map(cardHTML).join("") || `<p class="empty-row">No matches found.</p>`}</div>`;
  window.scrollTo({ top: 0 });
});

/* ============ INIT ============ */
renderHero();
renderRows();

</script>
</body>
</html>
